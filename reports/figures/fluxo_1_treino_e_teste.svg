xt><path d="M646.0,82.0 L702.0,82.0" fill="none" stroke="#7C8A81" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tt-seta-normal)"/><path d="M900.0,82.0 L956.0,82.0" fill="none" stroke="#7C8A81" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tt-seta-normal)"/><path d="M1102.0,82.0 L1152.0,82.0" fill="none" stroke="#7C8A81" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tt-seta-normal)"/><path d="M1226.0,120.0 L1226.0,180.0" fill="none" stroke="#C9920F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tt-seta-dourado)"/><text x="1214.0" y="156.0" font-size="11.5" font-weight="500" fill="#9A6C00" text-anchor="end" paint-order="stroke" stroke="#FBF7EF" stroke-width="5" stroke-linejoin="round">avalia 1 vez</text><path d="M646.0,218.0 L1152.0,218.0" fill="none" stroke="#C9920F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tt-seta-dourado)"/><text x="899.0" y="210.0" font-size="11.5" font-weight="500" fill="#9A6C00" text-anchor="middle" paint-order="stroke" stroke="#FBF7EF" stroke-width="5" stroke-linejoin="round">não entra em nenhuma escolha</text></svg>
