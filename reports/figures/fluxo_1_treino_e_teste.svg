<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1316 272" role="img" aria-label="Fluxo do treino e do teste: a POF vira uma grade pessoa por dia por período; o corte pelo mês da entrevista separa treino e teste; seleção, calibração e cortes usam só o treino; o modelo é congelado e avaliado uma única vez no teste." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Fluxo do treino e do teste: a POF vira uma grade pessoa por dia por período; o corte pelo mês da entrevista separa treino e teste; seleção, calibração e cortes usam só o treino; o modelo é congelado e avaliado uma única vez no teste.</title><defs><marker id="tt-seta-normal" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#7C8A81"/></marker><marker id="tt-seta-ativo" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#C8262C"/></marker><marker id="tt-seta-apagado" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#C9D3CA"/></marker><marker id="tt-seta-verde" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#0E7A41"/></marker><marker id="tt-seta-dourado" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#C9920F"/></marker><filter id="tt-sombra" x="-8%" y="-12%" width="116%" height="140%"><feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="#0B4A30" flood-opacity="0.11"/></filter></defs><rect x="0" y="0" width="1316" height="272" rx="18" fill="#FBF7EF"/><rect x="470" y="8" width="838" height="128" rx="16" fill="#F3F8F4" stroke="#E4F1E8" stroke-width="1"/><text x="486" y="27" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#0E7A41">TODAS AS ESCOLHAS USAM SÓ O TREINO</text><rect x="470" y="150" width="838" height="114" rx="16" fill="#FDF4DC" stroke="#EDCB6B" stroke-width="1" stroke-dasharray="5 4"/><text x="486" y="169" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#9A6C00">USADO UMA ÚNICA VEZ, NO FIM</text><g opacity="1.0"><rect x="16" y="44" width="152" height="76" rx="13" fill="#FFFFFF" stroke="#C9D3CA" stroke-width="1.4" filter="url(#tt-sombra)"/><text x="92.0" y="70.5" font-size="13.5" font-weight="700" fill="#1C2A21" text-anchor="middle" font-family="Poppins, Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">POF 2017–2018</text><text x="92.0" y="88.0" font-size="11.5" font-weight="400" fill="#5A675F" text-anchor="middle">microdados do IBGE</text><text x="92.0" y="103.5" font-size="11.5" font-weight="400" fill="#5A675F" text-anchor="middle">recordatório de 24h</text></g><g opacity="1.0"><rect x="222" y="44" width="170" height="76" rx="13" fill="#FFFFFF" stroke="#C9D3CA" stroke-width="1.4" filter="url(#tt-sombra)"/><text x="307.0" y="70.5" font-size="13.5" font-weight="700" fill="#1C2A21" text-anchor="middle" font-family="Poppins, Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">Grade</text><text x="307.0" y="88.0" font-size="11.5" font-weight="400" fill="#5A675F" text-anchor="middle">pessoa × dia × período</text><text x="307.0" y="103.5" font-size="11.5" font-weight="400" fill="#5A675F" text-anchor="middle">alvo: pizza + refri</text></g><g opacity="1.0"><rect x="496" y="44" width="150" height="76" rx="13" fill="#FFFFFF" stroke="#C9D3CA" stroke-width="1.4" filter="url(#tt-sombra)"/><text x="571.0" y="70.5" font-size="13.5" font-weight="700" fill="#1C2A21" text-anchor="middle" font-family="Poppins, Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">Treino</text><text x="571.0" y="88.0" font-size="11.5" font-weight="400" fill="#5A675F" text-anchor="middle">jul/2017 a fev/2018</text><text x="571.0" y="103.5" font-size="11.5" font-weight="400" fill="#5A675F" text-anchor="middle">523 ocasiões</text></g><g opacity="1.0"><rect x="702" y="44" width="198" height="76" rx="13" fill="#FFFFFF" stroke="#C9D3CA" stroke-width="1.4" filter="url(#tt-sombra)"/><text x="801.0" y="70.5" font-size="13.5" font-weight="700" fill="#1C2A21" text-anchor="middle" font-family="Poppins, Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">Seleção do modelo</text><text x="801.0" y="88.0" font-size="11.5" font-weight="400" fill="#5A675F" text-anchor="middle">validação cruzada 5 × 10</text><text x="801.0" y="103.5" font-size="11.5" font-weight="400" fill="#5A675F" text-anchor="middle">vence a Reg. Logística</text></g><g opacity="1.0"><rect x="956" y="44" width="146" height="76" rx="13" fill="#FFFFFF" stroke="#C9D3CA" stroke-width="1.4" filter="url(#tt-sombra)"/><text x="1029.0" y="70.5" font-size="13.5" font-weight="700" fill="#1C2A21" text-anchor="middle" font-family="Poppins, Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">Calibração</text><text x="1029.0" y="88.0" font-size="11.5" font-weight="400" fill="#5A675F" text-anchor="middle">sigmoide ponderada</text><text x="1029.0" y="103.5" font-size="11.5" font-weight="400" fill="#5A675F" text-anchor="middle">cortes P90 e P70</text></g><g opacity="1.0"><rect x="1152" y="44" width="148" height="76" rx="13" fill="#0B4A30" stroke="#0B4A30" stroke-width="1.4" filter="url(#tt-sombra)"/><text x="1226.0" y="70.5" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="Poppins, Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">Modelo congelado</text><text x="1226.0" y="88.0" font-size="11.5" font-weight="400" fill="#CFE6D8" text-anchor="middle">models/ + SHA-256</text><text x="1226.0" y="103.5" font-size="11.5" font-weight="400" fill="#CFE6D8" text-anchor="middle">commit antes do teste</text></g><g opacity="1.0"><rect x="496" y="180" width="150" height="76" rx="13" fill="#FFFFFF" stroke="#F0B323" stroke-width="1.8" 