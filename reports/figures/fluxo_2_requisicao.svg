<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1316 352" role="img" aria-label="Caminho de uma requisição: o app envia o contexto à API, que valida, aplica o mesmo preparo do treino, calcula o score com o modelo congelado, explica com SHAP e aplica as regras do Decision Engine; a resposta tem 6 campos." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Caminho de uma requisição: o app envia o contexto à API, que valida, aplica o mesmo preparo do treino, calcula o score com o modelo congelado, explica com SHAP e aplica as regras do Decision Engine; a resposta tem 6 campos.</title><defs><marker id="rq-seta-normal" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#7C8A81"/></marker><marker id="rq-seta-ativo" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#C8262C"/></marker><marker id="rq-seta-apagado" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#C9D3CA"/></marker><marker id="rq-seta-verde" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#0E7A41"/></marker><marker id="rq-seta-dourado" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#C9920F"/></marker><filter id="rq-sombra" x="-8%" y="-12%" width="116%" height="140%"><feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="#0B4A30" flood-opacity="0.11"/></filter></defs><rect x="0" y="0" width="1316" height="352" rx="18" fill="#FBF7EF"/><rect x="586" y="12" width="520" height="104" rx="16" fill="#F3F8F4" stroke="#E4F1E8" stroke-width="1"/><text x="600.0" y="31.0" font-size="12" font-weight="7