, monospace">top_factors</text><text x="1138.0" y="224.5" font-size="11" font-weight="500" fill="#0B4A30" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">recommendation_category</text><text x="1138.0" y="241.0" font-size="11" font-weight="500" fill="#0B4A30" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">recommendation_reason</text><text x="1138.0" y="257.5" font-size="11" font-weight="500" fill="#0B4A30" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">model_metadata</text></g><path d="M140.0,198.0 L236.0,198.0" fill="none" stroke="#7C8A81" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rq-seta-normal)"/><text x="188.0" y="189.0" font-size="11.5" font-weight="500" fill="#5A675F" text-anchor="middle" paint-order="stroke" stroke="#FBF7EF" stroke-width="5" stroke-linejoin="round">POST /predict</text><path d="M394.0,198.0 L422.0,198.0" fill="none" stroke="#7C8A81" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rq-seta-normal)"/><path d="M568.0,198.0 L600.0,198.0" fill="none" stroke="#7C8A81" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rq-seta-normal)"/><path d="M762.0,198.0 L790.0,198.0" fill="none" stroke="#7C8A81" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rq-seta-normal)"/><path d="M918.0,198.0 L946.0,198.0" fill="none" stroke="#7C8A81" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rq-seta-normal)"/><path d="M1092.0,198.0 L1122.0,198.0" fill="none" stroke="#7C8A81" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rq-seta-normal)"/><path d="M681.0,102.0 L681.0,158.0" fill="none" stroke="#0E7A41" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rq-seta-verde)"/><path d="M847.0,102.0 L847.0,